<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>NEXORA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#f4f8ff;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;border-bottom:1px solid #24405e}
.logo{font-size:25px;font-weight:bold;letter-spacing:4px}
.logo span{color:#54e1df}
header small{color:#54e1df}
main{max-width:850px;margin:auto;padding:20px;height:calc(100dvh - 155px);display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:10px 0}
.message{padding:13px 16px;border-radius:15px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.bot{background:#102b49;align-self:flex-start}
.user{background:#1763a2;align-self:flex-end}
#attachmentName{color:#54e1df;font-size:13px;padding:5px}
form{background:#10243c;border:1px solid #315071;border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center}
textarea{background:transparent;color:white;border:0;outline:none;resize:none;flex:1;min-width:0;font-size:16px;padding:10px}
button{border:0;border-radius:10px;padding:12px;background:#1763a2;color:white;font-size:16px}
button:disabled{opacity:.5}
#send{background:#54e1df;color:#071426;font-weight:bold}
#file{display:none}
footer{text-align:center;color:#829ab5;font-size:12px;padding:12px}
</style>
</head>
<body>
<header>
  <div class="logo">NEXORA<span>.</span></div>
  <small>Your AI assistant</small>
</header>

<main>
  <div id="chat">
    <div class="message bot">Hello! I'm NEXORA. 👋

Ask me anything, upload a picture for me to analyse, or share a document for me to review.</div>
  </div>

  <div id="attachmentName"></div>

  <form id="form">
    <label for="file"><button type="button">＋</button></label>
    <input id="file" type="file" accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.rtf,.odt,.ppt,.pptx,.xls,.xlsx">
    <textarea id="message" rows="1" placeholder="Message NEXORA..."></textarea>
    <button id="send" type="submit">➤</button>
  </form>
</main>

<footer>© 2026 NEXORA AI · Created by Joshua Aregbesola</footer>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const messageBox = document.getElementById("message");
const fileInput = document.getElementById("file");
const attachmentName = document.getElementById("attachmentName");
const sendButton = document.getElementById("send");

let messages = [];
let selectedFile = null;

function addMessage(text, role) {
  const bubble = document.createElement("div");
  bubble.className = "message " + role;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

fileInput.addEventListener("change", () => {
  selectedFile = fileInput.files[0] || null;
  attachmentName.textContent = selectedFile
    ? "📎 " + selectedFile.name
    : "";
});

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Could not read the file."));
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const typedText = messageBox.value.trim();
  if (!typedText && !selectedFile) return;

  const file = selectedFile;
  const userText = typedText || (
    file && file.type.startsWith("image/")
      ? "Please describe and analyse this image."
      : "Please analyse this document and explain its important points."
  );

  addMessage(userText + (file ? "\n📎 " + file.name : ""), "user");

  messages.push({ role: "user", content: userText });

  messageBox.value = "";
  selectedFile = null;
  fileInput.value = "";
  attachmentName.textContent = "";
  sendButton.disabled = true;
  addMessage("NEXORA is thinking...", "bot");

  try {
    let attachment = null;

    if (file) {
      if (file.size > 12 * 1024 * 1024) {
        throw new Error("Please choose a file smaller than 12 MB.");
      }

      attachment = {
        name: file.name,
        dataUrl: await readFile(file)
      };
    }

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages,
        language: "Auto-detect",
        attachment
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    const thinking = chat.lastElementChild;
    if (thinking && thinking.textContent === "NEXORA is thinking...") {
      thinking.remove();
    }

    addMessage(data.reply || "I couldn't generate a response.", "bot");
    messages.push({ role: "assistant", content: data.reply || "" });

  } catch (error) {
    const thinking = chat.lastElementChild;
    if (thinking && thinking.textContent === "NEXORA is thinking...") {
      thinking.remove();
    }
    addMessage("Sorry! " + error.message, "bot");
    messages.pop();
  } finally {
    sendButton.disabled = false;
    messageBox.focus();
  }
});
</script>
</body>
</html>
