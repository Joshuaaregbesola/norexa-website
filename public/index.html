<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="NEXORA AI — Your intelligence. Your world.">
  <title>NEXORA AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  hello nexora
  <div class="app-shell">
   <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div><strong>NEXORA</strong><span>AI ASSISTANT</span></div>
      </div>
      <button class="new-chat" id="newChatBtn"><span>＋</span> New chat</button>
      <div class="side-label">RECENT CHATS</div>
      <div class="history-list" id="historyList"></div>
      <div class="sidebar-bottom">
        <div class="profile-dot">N</div>
        <div class="profile-copy"><strong>NEXORA</strong><span>Personal assistant</span></div>
        <button class="icon-button" id="clearHistoryBtn" title="Clear chat history" aria-label="Clear chat history">⌫</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="mobile-brand"><span class="mini-mark">N</span><strong>NEXORA</strong></div>
        <div class="topbar-spacer"></div>
        <label class="language-control">
          <span>Language</span>
          <select id="languageSelect" aria-label="Response language">
            <option>Auto-detect</option><option>English</option><option>Nigerian Pidgin</option>
            <option>Yoruba</option><option>Igbo</option><option>Hausa</option><option>French</option><option>Spanish</option>
          </select>
        </label>
        <div class="online-pill"><i></i> AI assistant</div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="orb-wrap"><div class="orb"><span>N</span></div></div>
          <div class="eyebrow">YOUR AI COMPANION</div>
          <h1>Where should we<br><em>begin today?</em></h1>
          <p>I'm NEXORA. Ask me anything, share an image, or bring a document to explore.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain artificial intelligence in simple terms."><span>✦</span><b>Explain something</b><small>Make a complex topic simple</small></button>
            <button class="suggestion" data-prompt="Help me come up with a practical business idea in Nigeria."><span>↗</span><b>Explore an idea</b><small>Turn a thought into a plan</small></button>
            <button class="suggestion" data-prompt="Help me write a clear and professional message."><span>✎</span><b>Write with me</b><small>Messages, letters and more</small></button>
            <button class="suggestion" data-prompt="Teach me something useful today."><span>◎</span><b>Learn something</b><small>Discover a new skill</small></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <div class="attachment-preview" id="attachmentPreview" hidden></div>
        <form class="composer" id="chatForm">
          <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.rtf,.odt,.ppt,.pptx,.xls,.xlsx">
          <button class="attach-btn" type="button" id="attachBtn" title="Attach image or document" aria-label="Attach file">＋</button>
          <textarea id="messageInput" rows="1" placeholder="Message NEXORA..." aria-label="Message NEXORA"></textarea>
          <button class="voice-btn" type="button" id="voiceBtn" title="Voice input" aria-label="Voice input">🎙</button>
          <button class="send-btn" type="submit" id="sendBtn" aria-label="Send message">↑</button>
        </form>
        <div class="composer-note">NEXORA can make mistakes. Check important information.</div>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
